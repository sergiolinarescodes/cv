name: Deploy CV to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc + WeasyPrint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq pandoc \
            libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libgdk-pixbuf2.0-0 libffi-dev shared-mime-info
          python3 -m pip install --upgrade pip
          python3 -m pip install --user 'weasyprint>=63'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Generate cv-en.docx (pandoc)
        run: |
          pandoc cv-en.md -f markdown -t docx -o cv-en.docx

      - name: Generate cv-en.html (pandoc) and cv-en.pdf (WeasyPrint)
        run: |
          pandoc cv-en.md -s \
            --metadata pagetitle="Sergio Linares Peralta - CV" \
            --css=cv-print.css \
            -o cv-en.html
          weasyprint cv-en.html cv-en.pdf

      - name: List artifacts
        run: ls -la cv-en.docx cv-en.pdf cv-en.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
